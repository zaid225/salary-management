name = "salary-management-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://salary-management.zaidansari2249.workers.dev"

# The Hyperdrive config id is a resource handle, not a credential - the
# Postgres connection string it wraps is stored on Cloudflare's side and
# never appears here. Created with:
#   npx wrangler hyperdrive create salary-management-db --connection-string="<DATABASE_URL>"
#
# For local `wrangler dev`, put your Postgres URL in .dev.vars as
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE rather than adding a
# localConnectionString here, so a real credential never lands in a committed
# file.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "79cb481ffac641218ea8a8b6fc23400c"
